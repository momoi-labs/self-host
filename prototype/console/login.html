<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>homelab — login</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  body { font-family: 'Inter', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

<div class="bg-white rounded-2xl shadow-sm border border-gray-200 w-full max-w-sm mx-4 p-8">
  <div class="text-center mb-8">
    <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-4">
      <span class="text-white font-bold text-xl">H</span>
    </div>
    <h1 class="text-xl font-bold mb-1">homelab</h1>
    <p class="text-sm text-gray-500">Enter your API key to access the console</p>
  </div>

  <form onsubmit="login(event)" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5" for="key">API Key</label>
      <input type="password" id="key" placeholder="sk-..." autocomplete="off"
        class="mono w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
    </div>
    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition-colors">
      Unlock
    </button>
  </form>

  <p id="error" class="hidden mt-4 text-sm text-red-600 text-center"></p>
  <p class="mt-6 text-xs text-gray-400 text-center">
    Run <code class="mono bg-gray-100 px-1 rounded">self-host serve</code> to get your API key
  </p>
</div>

<script>
async function login(e) {
  e.preventDefault();
  const key = document.getElementById('key').value.trim();
  if (!key) return;

  const res = await fetch('/health', { headers: { 'Authorization': 'Bearer ' + key } });
  if (!res.ok) {
    document.getElementById('error').classList.remove('hidden');
    document.getElementById('error').textContent = 'Invalid API key';
    return;
  }

  sessionStorage.setItem('api_key', key);
  window.location.href = '/console/';
}
</script>

</body>
</html>
