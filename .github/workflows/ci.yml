name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run test:release
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: check

  s6-bundle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: ./scripts/release-s6.sh ${{ matrix.target }}
      - name: Verify static ELF executables
        env:
          TARGET: ${{ matrix.target }}
        run: |
          machine='Advanced Micro Devices X86-64'
          if [[ "$TARGET" == aarch64-* ]]; then machine=AArch64; fi
          for binary in target/"$TARGET"/release/s6/bin/*; do
            readelf -h "$binary" | grep -q "Machine:.*$machine"
            if readelf -l "$binary" | grep -q INTERP; then
              echo "$binary needs a dynamic loader"
              exit 1
            fi
          done
      - name: Test installation and supervision without system s6
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          docker run --rm --network none -e SELF_HOST_RELEASE_TEST=1 \
            -v "$PWD:/source:ro" ubuntu:24.04 \
            bash /source/scripts/test-release-s6.sh \
            /source/target/x86_64-unknown-linux-gnu/release/s6 /source/install.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The console ships inside the binary, so it is built before cargo is.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: console
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --check
      - run: cargo test --no-fail-fast
      - run: cargo clippy -- -D warnings

  # Native supervision is validated on a disposable Apple Silicon runner.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The console ships inside the binary, so it is built before cargo is.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci && npm run build
        working-directory: console
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --no-fail-fast
      - run: cargo build
      - name: Build and exercise macOS native supervision
        run: |
          ./scripts/release-s6.sh aarch64-apple-darwin
          SELF_HOST_NATIVE_TEST=1 bash scripts/test-native-macos.sh \
            target/debug/self-host target/aarch64-apple-darwin/release/s6
