name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to retry, or snapshot
        default: snapshot
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            command: zigbuild
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            command: zigbuild
          - os: macos-latest
            target: x86_64-apple-darwin
            command: build
          - os: macos-latest
            target: aarch64-apple-darwin
            command: build
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION == 'snapshot' && github.sha || env.VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Check release version
        if: env.VERSION != 'snapshot'
        run: |
          if [[ ! -f scripts/release-cargo.sh ]]; then
            echo "This tag predates parallel artifact packaging. Re-run its original release run instead."
            exit 1
          fi
          node scripts/release-version.mjs check "${VERSION#v}"

      - run: npm ci && npm run build
        working-directory: console

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}

      - uses: mlugg/setup-zig@v1
        if: runner.os == 'Linux'
        with:
          version: 0.13.0

      - run: cargo install --locked cargo-zigbuild
        if: runner.os == 'Linux'

      - run: cargo ${{ matrix.command }} --release --locked --target ${{ matrix.target }}

      # Tar preserves the executable mode when transferring between runners.
      - run: tar czf ${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release self-host

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ matrix.target }}.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION == 'snapshot' && github.sha || env.VERSION }}
          fetch-depth: 0

      - name: Check release credentials
        if: env.VERSION != 'snapshot' && !contains(env.VERSION, '-')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$HOMEBREW_TAP_TOKEN" || { echo "Missing HOMEBREW_TAP_TOKEN"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: prebuilt
          merge-multiple: true

      - name: Unpack release binaries
        run: |
          for archive in prebuilt/*.tar.gz; do
            target=$(basename "$archive" .tar.gz)
            mkdir -p "prebuilt/$target"
            tar xzf "$archive" -C "prebuilt/$target"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare release notes
        if: env.VERSION != 'snapshot'
        run: node scripts/release-version.mjs notes > release-notes.md

      # GoReleaser's Rust builder still prepares target metadata. The tool hook
      # imports the matrix artifacts, so this job needs no Zig or compilation.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --clean ${{ env.VERSION == 'snapshot' && '--snapshot' || '--release-notes=release-notes.md' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SELF_HOST_PREBUILT_DIR: ${{ github.workspace }}/prebuilt

      - name: Replace the moving snapshot
        if: env.VERSION == 'snapshot'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view snapshot > /dev/null 2>&1; then
            gh release delete snapshot --cleanup-tag --yes
          fi

      - uses: softprops/action-gh-release@v2
        if: env.VERSION == 'snapshot'
        with:
          tag_name: snapshot
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            dist/*.tar.gz
            dist/*.pkg.tar.zst
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
