name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# A tag push releases that tag. A manual run releases `snapshot`, one moving
# pre-release used to exercise install.sh without minting a version.
env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && 'snapshot' || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      # The console ships inside the binary. It is the same static output
      # whatever the Rust target is, so it is built once, before cargo.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json

      - run: npm ci && npm run build
        working-directory: console

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - run: rustup target add ${{ matrix.target }}

      - run: cargo install cargo-zigbuild

      - run: cargo zigbuild --release --target ${{ matrix.target }}
        env:
          CARGO_PROFILE_RELEASE_LTO: thin

      - run: |
          cd target/${{ matrix.target }}/release
          tar czf self-host_${{ env.VERSION }}_${{ matrix.target }}.tar.gz self-host

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/self-host_${{ env.VERSION }}_${{ matrix.target }}.tar.gz

  darwin:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      # The console ships inside the binary. It is the same static output
      # whatever the Rust target is, so it is built once, before cargo.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json

      - run: npm ci && npm run build
        working-directory: console

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - run: rustup target add ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_PROFILE_RELEASE_LTO: thin

      - run: |
          cd target/${{ matrix.target }}/release
          tar czf self-host_${{ env.VERSION }}_${{ matrix.target }}.tar.gz self-host

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/self-host_${{ env.VERSION }}_${{ matrix.target }}.tar.gz

  publish:
    needs: [linux, darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - run: cd dist && sha256sum *.tar.gz > checksums.txt

      # There is only ever one snapshot. Removing the previous release and
      # its tag is what lets the tag land on the commit that was just built.
      - if: env.VERSION == 'snapshot'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete snapshot --cleanup-tag --yes || true

      # A tag with a pre-release suffix, `v0.2.0-beta.1`, publishes as a
      # pre-release, so it never becomes the `latest` the installer resolves
      # on its own. It is installed by naming the version, and the snapshot
      # is a pre-release for the same reason.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          prerelease: ${{ env.VERSION == 'snapshot' || contains(env.VERSION, '-') }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
