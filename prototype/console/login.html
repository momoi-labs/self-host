<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>homelab — login</title>
  <link rel="stylesheet" href="/console/tokens.css">
  <link rel="stylesheet" href="/console/console.css">
  <script src="/console/theme.js"></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-panel" aria-labelledby="login-title">
      <div class="row-between">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">H</span>
          <div><h1 id="login-title">homelab</h1><p class="muted">Unlock the operator console</p></div>
        </div>
        <button type="button" class="button button-ghost theme-toggle" data-theme-toggle>Light theme</button>
      </div>
      <form id="login-form" class="card stack">
        <div class="field">
          <label for="key">API key</label>
          <input class="input mono" type="password" id="key" placeholder="sk-…" autocomplete="off" required autofocus>
        </div>
        <p id="error" class="alert hidden" role="alert"></p>
        <button type="submit" class="button button-primary button-block">Unlock</button>
        <p class="metadata">Run <code>self-host serve</code> to get your API key.</p>
      </form>
    </section>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const key = document.getElementById('key').value.trim();
      const error = document.getElementById('error');
      error.classList.add('hidden');
      try {
        const response = await fetch('/health', { headers: { Authorization: 'Bearer ' + key } });
        if (!response.ok) throw new Error('That API key was not accepted. Check it and try again.');
        sessionStorage.setItem('api_key', key);
        window.location.href = '/console/';
      } catch (cause) {
        error.textContent = cause.message || 'Could not reach the host. Check the connection and try again.';
        error.classList.remove('hidden');
        document.getElementById('key').focus();
      }
    });
  </script>
</body>
</html>
