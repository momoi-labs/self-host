<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>homelab console</title>
  <link rel="stylesheet" href="/console/tokens.css">
  <link rel="stylesheet" href="/console/console.css">
  <script src="/console/theme.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">H</span>
          <div><h1>homelab</h1><p class="metadata mono" id="dns-suffix">…</p></div>
        </div>
        <button id="deploy-btn" class="button button-primary button-block" type="button">Deploy application</button>
      </header>
      <p class="section-label sidebar-header">Applications</p>
      <nav class="sidebar-nav" id="sidebar" aria-label="Applications"></nav>
      <footer class="sidebar-footer">
        <a href="/console/setup.html" class="nav-link">Setup</a>
        <button type="button" class="button button-ghost theme-toggle" data-theme-toggle>Light theme</button>
        <div class="row-between">
          <span class="row muted"><span class="status-dot success" id="health-dot"></span><span id="health-text">Checking health…</span></span>
          <button type="button" onclick="logout()" class="button button-ghost">Lock</button>
        </div>
      </footer>
    </aside>
    <main class="main">
      <section id="empty-state" class="empty-state" aria-labelledby="empty-title">
        <h2 id="empty-title">Select an application</h2>
        <p>Choose an application from the list to inspect its configuration and logs.</p>
      </section>
      <section id="detail" class="detail hidden" aria-live="polite">
        <div class="config-panel" id="config-panel"></div>
        <div class="splitter" id="splitter" aria-hidden="true"></div>
        <div class="logs-panel" id="logs-panel"></div>
      </section>
    </main>
  </div>
  <div id="deploy-modal" class="dialog-overlay hidden">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="deploy-title" aria-describedby="deploy-description">
      <div class="row-between">
        <h2 id="deploy-title">Deploy application</h2>
        <button id="deploy-close" type="button" class="button button-ghost" aria-label="Close dialog">Close</button>
      </div>
      <p id="deploy-description" class="muted">Create an application from a container image.</p>
      <form id="deploy-form" class="stack">
        <div class="field">
          <label for="deploy-name">Application name</label>
          <input class="input" type="text" id="deploy-name" placeholder="my-app" required aria-describedby="deploy-name-help">
          <small class="muted" id="deploy-name-help">Lowercase letters, numbers and hyphens; at most 63 characters.</small>
        </div>
        <div class="field">
          <label for="deploy-image">Container image</label>
          <input class="input mono" type="text" id="deploy-image" placeholder="nginx:alpine" required>
        </div>
        <p id="deploy-error" class="alert hidden" role="alert"></p>
        <div class="dialog-actions">
          <button id="deploy-cancel" type="button" class="button">Cancel</button>
          <button type="submit" class="button button-primary">Deploy</button>
        </div>
      </form>
    </section>
  </div>
  <script src="/console/app.js"></script>
</body>
</html>
