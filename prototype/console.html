<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>homelab console — reference design</title>
<!--
  PROTOTYPE — reference design for the homelab web management console.
  Selected variant: Compact sidebar + split detail (config | logs).
  All other variants live on the throwaway branch.
  This file is a throwaway reference, not production code.
-->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  body { font-family: 'Inter', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .status-dot { width: 8px; height: 8px; }
  .app-item.active { background: #eef2ff; border-left: 3px solid #4f46e5; }
  .splitter { width: 4px; cursor: col-resize; background: #e5e7eb; flex-shrink: 0; transition: background 0.15s; position: relative; }
  .splitter:hover, .splitter.dragging { background: #4f46e5; }
  .splitter::after { content: ''; position: absolute; inset: 0 -4px; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
</style>
</head>
<body class="bg-gray-50 text-gray-900">

<div class="flex h-screen">
  <!-- Sidebar -->
  <aside class="w-72 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
    <div class="px-5 py-4 border-b border-gray-100">
      <div class="flex items-center gap-2.5 mb-3">
        <div class="w-7 h-7 bg-indigo-600 rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-xs">H</span>
        </div>
        <div>
          <h1 class="font-semibold text-sm">homelab</h1>
          <p class="text-[10px] text-gray-400 mono">home.lan</p>
        </div>
      </div>
      <button onclick="showDeployModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-xs font-medium transition-colors">
        + Deploy
      </button>
    </div>
    <div class="px-3 py-3 border-b border-gray-100">
      <p class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Applications</p>
    </div>
    <nav class="flex-1 overflow-y-auto px-2 py-1" id="sidebar"></nav>
    <div class="px-4 py-3 border-t border-gray-100 flex items-center gap-2">
      <span class="status-dot rounded-full bg-emerald-500 inline-block"></span>
      <span class="text-xs text-gray-500">Platform healthy</span>
    </div>
  </aside>

  <!-- Detail: config (left) + logs (right) -->
  <div class="flex-1 flex overflow-hidden">
    <div id="empty-state" class="flex-1 flex items-center justify-center text-gray-400">
      <div class="text-center">
        <div class="text-5xl mb-3">📦</div>
        <p class="text-sm">Select an application from the sidebar</p>
      </div>
    </div>
    <div id="detail" class="flex-1 flex hidden">
      <div class="overflow-y-auto p-6" id="config-panel" style="flex-basis:50%"></div>
      <div class="splitter" id="splitter"></div>
      <div class="flex-1 overflow-y-auto p-6 bg-gray-900" id="logs-panel"></div>
    </div>
  </div>
</div>

<!-- Deploy modal -->
<div id="deploy-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center" style="z-index:10001" onclick="if(event.target===this)closeDeployModal()">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md mx-4 p-6" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-lg font-semibold">Deploy Application</h3>
      <button onclick="closeDeployModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
    </div>
    <form onsubmit="return false" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Application name</label>
        <input type="text" id="deploy-name" placeholder="my-app" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        <p class="text-xs text-gray-400 mt-1">Lowercase, hyphens, max 63 chars</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Docker image</label>
        <input type="text" id="deploy-image" placeholder="nginx:alpine" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="closeDeployModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Cancel</button>
        <button type="button" onclick="deploy()" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors">Deploy</button>
      </div>
    </form>
  </div>
</div>

<script>
const DNS_SUFFIX = 'home.lan';
let apps = [
  { name: 'blog',       hostname: 'blog.home.lan',       image: 'ghost:5-alpine',          status: 'running', port: 80 },
  { name: 'files',      hostname: 'files.home.lan',      image: 'filebrowser/filebrowser', status: 'running', port: 80 },
  { name: 'monitoring', hostname: 'monitoring.home.lan', image: 'grafana/grafana',         status: 'running', port: 3000 },
  { name: 'recipes',    hostname: 'recipes.home.lan',    image: 'mealie:v2',               status: 'running', port: 9000 },
];
let selected = null;

function render() {
  const list = document.getElementById('sidebar');
  list.innerHTML = apps.map(a => `
    <button onclick="selectApp('${esc(a.name)}')" class="app-item w-full text-left px-3 py-2.5 rounded-lg mb-0.5 transition-colors hover:bg-gray-50 flex items-center gap-2.5" data-name="${esc(a.name)}">
      <span class="status-dot rounded-full ${a.status === 'running' ? 'bg-emerald-500' : 'bg-red-500'} inline-block flex-shrink-0"></span>
      <span class="text-sm font-medium truncate flex-1">${esc(a.name)}</span>
    </button>
  `).join('');

  if (selected && apps.find(a => a.name === selected)) {
    selectApp(selected);
  } else {
    selected = null;
    document.getElementById('empty-state').classList.remove('hidden');
    document.getElementById('detail').classList.add('hidden');
  }
}

function selectApp(name) {
  selected = name;
  const app = apps.find(a => a.name === name);
  if (!app) return;

  document.querySelectorAll('#sidebar .app-item').forEach(el => el.classList.remove('active'));
  const btn = document.querySelector(`#sidebar [data-name="${CSS.escape(name)}"]`);
  if (btn) btn.classList.add('active');

  document.getElementById('empty-state').classList.add('hidden');
  document.getElementById('detail').classList.remove('hidden');

  document.getElementById('config-panel').innerHTML = `
    <div class="flex items-center justify-between mb-6">
      <div>
        <h2 class="text-xl font-bold">${esc(app.name)}</h2>
        <a href="http://${esc(app.hostname)}" target="_blank" class="text-indigo-600 hover:text-indigo-800 text-sm mono">${esc(app.hostname)} ↗</a>
      </div>
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium ${app.status === 'running' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}">
        <span class="status-dot rounded-full ${app.status === 'running' ? 'bg-emerald-500' : 'bg-red-500'} inline-block"></span>
        ${app.status}
      </span>
    </div>
    <div class="space-y-4">
      <div>
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Image</p>
        <div class="flex items-center gap-2 bg-gray-50 rounded-lg px-4 py-2.5">
          <span class="mono text-sm">${esc(app.image)}</span>
        </div>
      </div>
      <div>
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Container</p>
        <p class="mono text-sm bg-gray-50 rounded-lg px-4 py-2.5">self-host-app-${esc(app.name)}</p>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Port</p>
          <p class="mono text-sm bg-gray-50 rounded-lg px-4 py-2.5">${app.port}</p>
        </div>
        <div>
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Network</p>
          <p class="mono text-sm bg-gray-50 rounded-lg px-4 py-2.5">self-host</p>
        </div>
      </div>
      <div>
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">DNS Suffix</p>
        <p class="mono text-sm bg-gray-50 rounded-lg px-4 py-2.5">home.lan</p>
      </div>
    </div>
    <div class="mt-8 pt-6 border-t border-gray-100">
      <button onclick="if(confirm('Remove ${esc(app.name)}?')){removeApp('${esc(app.name)}');render();}" class="text-sm text-red-500 hover:text-red-700 font-medium transition-colors">
        Remove application
      </button>
    </div>
  `;

  document.getElementById('logs-panel').innerHTML = `
    <div class="flex items-center gap-2 mb-4">
      <div class="flex gap-1.5">
        <span class="w-3 h-3 rounded-full bg-red-400"></span>
        <span class="w-3 h-3 rounded-full bg-yellow-400"></span>
        <span class="w-3 h-3 rounded-full bg-emerald-400"></span>
      </div>
      <span class="mono text-xs text-gray-400">logs — ${esc(app.name)}</span>
    </div>
    <div class="mono text-xs space-y-1">
      <p class="text-gray-500">$ self-host logs ${esc(app.name)} --follow</p>
      <p class="text-emerald-400">[10:32:01] Starting ${esc(app.name)}...</p>
      <p class="text-emerald-400">[10:32:02] Pulling image ${esc(app.image)}</p>
      <p class="text-emerald-400">[10:32:03] Container started (${app.port}/tcp)</p>
      <p class="text-emerald-400">[10:32:04] Traefik route: Host(\`${esc(app.hostname)}\`) → ${app.port}</p>
      <p class="text-emerald-400">[10:32:05] Ready</p>
      <p class="text-gray-500">[10:33:12] GET / 200 0.042s</p>
      <p class="text-gray-500">[10:33:15] GET /api/health 200 0.008s</p>
      <p class="text-gray-500">[10:34:01] GET / 200 0.038s</p>
      <p class="text-yellow-400">[10:35:22] WARN connection pool 80% utilized</p>
      <p class="text-gray-500">[10:35:45] GET /assets/main.css 200 0.005s</p>
      <p class="text-gray-500 mt-2">— streaming —</p>
    </div>
  `;
}

function showDeployModal() {
  document.getElementById('deploy-modal').classList.remove('hidden');
  document.getElementById('deploy-name').focus();
}

function closeDeployModal() {
  document.getElementById('deploy-modal').classList.add('hidden');
}

function deploy() {
  const name = document.getElementById('deploy-name').value.trim();
  const image = document.getElementById('deploy-image').value.trim();
  if (!name || !image) return;
  apps.push({ name, hostname: `${name}.${DNS_SUFFIX}`, image, status: 'running', port: 80 });
  document.getElementById('deploy-name').value = '';
  document.getElementById('deploy-image').value = '';
  selected = name;
  closeDeployModal();
  render();
}

function removeApp(name) {
  apps = apps.filter(a => a.name !== name);
  selected = null;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Resizable splitter ─────────────────────────────────────────
(function() {
  const splitter = document.getElementById('splitter');
  const config = document.getElementById('config-panel');
  const logs = document.getElementById('logs-panel');
  let dragging = false;

  splitter.addEventListener('mousedown', (e) => {
    e.preventDefault();
    dragging = true;
    splitter.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const detail = document.getElementById('detail');
    const rect = detail.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const total = rect.width - splitter.offsetWidth;
    const pct = Math.max(15, Math.min(85, (x / total) * 100));
    config.style.flexBasis = pct + '%';
    logs.style.flex = '1';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

render();
</script>

</body>
</html>
