[package]
name = "self-host"
version = "0.2.0-beta.2"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
hickory-server = { version = "0.26", default-features = false, features = ["resolver"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "server-auto", "http1", "http2"] }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
md-5 = "0.10"
mime_guess = "2"
pem = "3"
rand = "0.9"
rcgen = { version = "0.13", features = ["x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = ["tls12", "ring"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["auth", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
x509-parser = { version = "0.16", features = ["verify"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
