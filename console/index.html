<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>self-host console</title>
  <script>
    /* Runs before the body parses, so the stored theme is on :root for the
       first paint and there is no flash of the wrong theme. */
    try {
      var stored = localStorage.getItem("kiso-theme");
      if (stored === "light" || stored === "dark") document.documentElement.dataset.theme = stored;
    } catch (cause) {}
  </script>
</head>
<body>
<div id="root"></div>
<script src="/prism-yaml.js" data-manual></script>
<script src="/prism-shell.js"></script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
