version: 2
project_name: self-host

builds:
  - id: linux
    builder: rust
    # CI supplies binaries from the parallel build jobs. Local runs use Cargo.
    tool: '{{ if index .Env "SELF_HOST_PREBUILT_DIR" }}./scripts/release-cargo.sh{{ else }}cargo{{ end }}'
    binary: self-host
    flags: [--release, --locked]
    env:
      - CARGO_PROFILE_RELEASE_LTO=thin
    hooks:
      pre: ./scripts/release-s6.sh {{ .Target }}
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
  - id: macos
    builder: rust
    tool: '{{ if index .Env "SELF_HOST_PREBUILT_DIR" }}./scripts/release-cargo.sh{{ else }}cargo{{ end }}'
    command: build
    binary: self-host
    flags: [--release, --locked]
    env:
      - CARGO_PROFILE_RELEASE_LTO=thin
    hooks:
      pre: ./scripts/release-s6.sh {{ .Target }}
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin

archives:
  - id: linux
    ids: [linux]
    formats: [tar.gz]
    # Keep the names consumed by install.sh, including the v prefix.
    name_template: "{{ .ProjectName }}_{{ if .IsSnapshot }}snapshot{{ else }}{{ .Tag }}{{ end }}_{{ .Target }}"
    files:
      - LICENSE
      - src: target/{{ .Target }}/release/s6/bin/*
        dst: s6/bin
        strip_parent: true
      - src: target/{{ .Target }}/release/s6/licenses/*
        dst: s6/licenses
        strip_parent: true
      - src: target/{{ .Target }}/release/s6/versions.txt
        dst: s6
        strip_parent: true
  - id: macos
    ids: [macos]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ if .IsSnapshot }}snapshot{{ else }}{{ .Tag }}{{ end }}_{{ .Target }}"
    files:
      - LICENSE
      - src: target/{{ .Target }}/release/s6/bin/*
        dst: s6/bin
        strip_parent: true
      - src: target/{{ .Target }}/release/s6/licenses/*
        dst: s6/licenses
        strip_parent: true
      - src: target/{{ .Target }}/release/s6/versions.txt
        dst: s6
        strip_parent: true

homebrew_casks:
  - name: self-host
    ids: [macos]
    binaries: [self-host]
    homepage: https://github.com/momoi-labs/self-host
    description: Publish applications on your own LAN
    skip_upload: auto
    repository:
      owner: momoi-labs
      name: homebrew-packages
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    caveats: |
      This package installs the binary only. It does not configure Docker,
      DNS, or a launchd daemon. See the repository README for Host setup.
    # These binaries are not Apple-notarized. Limit the hook to our binary.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/self-host"]
          end

aurs:
  - name: self-host-bin
    ids: [linux]
    homepage: https://github.com/momoi-labs/self-host
    description: Publish applications on your own LAN
    license: MIT AND ISC
    # Generate the recipe locally, but do not publish until AUR access is ready.
    skip_upload: true
    depends: [glibc, gcc-libs]
    optdepends:
      - "docker: run Applications"
      - "docker-compose: run Compose Applications"
    provides: [self-host]
    conflicts: [self-host]
    package: |
      install -Dm755 "self-host" "${pkgdir}/usr/bin/self-host"
      install -Dm644 "LICENSE" "${pkgdir}/usr/share/licenses/self-host-bin/LICENSE"
      install -d "${pkgdir}/usr/libexec/self-host/s6" "${pkgdir}/usr/share/licenses/self-host-bin/s6"
      install -m755 s6/bin/* "${pkgdir}/usr/libexec/self-host/s6/"
      install -m644 s6/licenses/* "${pkgdir}/usr/share/licenses/self-host-bin/s6/"
      install -m644 s6/versions.txt "${pkgdir}/usr/share/licenses/self-host-bin/s6/versions.txt"

nfpms:
  - ids: [linux]
    package_name: self-host-bin
    maintainer: momoi-labs
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/momoi-labs/self-host
    description: Publish applications on your own LAN
    license: MIT AND ISC
    formats: [archlinux, deb, rpm]
    dependencies: [glibc, gcc-libs]
    overrides:
      deb:
        dependencies: [libc6, libgcc-s1]
      rpm:
        dependencies: [glibc, libgcc]
    provides: [self-host]
    conflicts: [self-host]
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/self-host-bin/LICENSE
      - src: target/{{ .Target }}/release/s6/bin/
        dst: /usr/libexec/self-host/s6
        file_info:
          mode: 0755
      - src: target/{{ .Target }}/release/s6/licenses/
        dst: /usr/share/licenses/self-host-bin/s6
        file_info:
          mode: 0644
      - src: target/{{ .Target }}/release/s6/versions.txt
        dst: /usr/share/licenses/self-host-bin/s6/versions.txt

checksum:
  name_template: checksums.txt

changelog:
  # This must stay enabled to load the Changesets --release-notes file.
  disable: false

release:
  github:
    owner: momoi-labs
    name: self-host
  prerelease: auto
  footer: |
    **Full changelog:** https://github.com/momoi-labs/self-host/compare/{{ .PreviousTag }}...{{ .Tag }}
