<!doctype html>
<html lang="en"
  data-accent="terracotta"
  data-border-style="solid"
  data-corner-style="rounded"
  data-corner-marks="none"
  data-corner-size="small"
  data-mark-size="large"
  data-visual-style="default"
  data-app-shell="default"
  data-frame-scope="panels"
  data-mark-scope="all"
  data-mark-clearance="normal"
  data-background-style="construction"
  data-background-strength="quiet"
  data-background-placement="both"
  data-frame-detail="small"
  data-paper-tone="theme"
  data-panel-fill="translucent"
  data-outer-border-style="inherit"
  data-outer-corner-style="inherit"
  data-outer-corner-marks="inherit"
>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DNS setup — self-host</title>
  <script>
    /* Runs before the body parses, so the stored theme is on :root for the
       first paint and there is no flash of the wrong theme. */
    try {
      var stored = localStorage.getItem("kiso-theme");
      if (stored === "light" || stored === "dark") document.documentElement.dataset.theme = stored;
    } catch (cause) {}
  </script>
</head>
<body>
<div id="root"></div>

<script type="module" src="/src/setup.tsx"></script>
</body>
</html>
