<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API keys — homelab</title>
  <link rel="stylesheet" href="/console/tokens.css">
  <link rel="stylesheet" href="/console/console.css">
  <script src="/console/theme.js"></script>
</head>
<body>
  <main class="page">
    <header class="page-header row-between">
      <div><h1>API keys</h1><p class="muted">Manage access for other operators.</p></div>
      <div class="row"><div class="theme-toggle" data-theme-toggle></div><a class="button" href="/console/">Back to console</a></div>
    </header>
    <section class="card page-section" aria-labelledby="create-heading">
      <h2 id="create-heading">Create a key</h2>
      <form id="create-form" class="row">
        <div class="field grow"><label for="key-label">Label</label><input class="input" id="key-label" placeholder="Laptop" required></div>
        <button class="button button-primary" type="submit">Create key</button>
      </form>
      <p id="create-error" class="alert hidden" role="alert"></p>
      <div id="new-key-box" class="alert notice hidden" role="status"><strong>Copy this key now. It will not be shown again.</strong><p class="mono" id="new-key-value"></p></div>
    </section>
    <section class="table-wrap" aria-labelledby="keys-heading">
      <h2 id="keys-heading" class="hidden">Existing API keys</h2>
      <table><thead><tr><th scope="col">ID</th><th scope="col">Label</th><th scope="col">Created</th><th scope="col">Action</th></tr></thead><tbody id="keys-body"><tr><td colspan="4" class="muted">No API keys yet.</td></tr></tbody></table>
    </section>
  </main>
  <script>
    function apiKey() { return sessionStorage.getItem('api_key') || ''; }
    function authHeaders() { return { Authorization: 'Bearer ' + apiKey(), 'Content-Type': 'application/json' }; }
    function esc(value) { return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    async function loadKeys() {
      if (!apiKey()) { window.location.href = '/console'; return; }
      try {
        const response = await fetch('/api-keys', { headers: authHeaders() });
        if (!response.ok) return;
        const keys = await response.json();
        document.getElementById('keys-body').innerHTML = keys.length ? keys.map(key => `<tr><td class="mono">${esc(key.id)}</td><td>${esc(key.label)}</td><td>${esc(key.created_at)}</td><td><button type="button" class="button button-danger" data-revoke="${esc(key.id)}">Revoke</button></td></tr>`).join('') : '<tr><td colspan="4" class="muted">No API keys yet.</td></tr>';
      } catch {}
    }
    document.getElementById('keys-body').addEventListener('click', async (event) => {
      const id = event.target.dataset.revoke;
      if (!id || !confirm(`Revoke key ${id}?`)) return;
      await fetch('/api-keys/' + encodeURIComponent(id), { method: 'DELETE', headers: authHeaders() });
      loadKeys();
    });
    document.getElementById('create-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const error = document.getElementById('create-error');
      error.classList.add('hidden');
      try {
        const response = await fetch('/api-keys', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ label: document.getElementById('key-label').value.trim() }) });
        if (!response.ok) throw new Error('Could not create the key. Try again.');
        const data = await response.json();
        document.getElementById('key-label').value = '';
        document.getElementById('new-key-value').textContent = data.key;
        document.getElementById('new-key-box').classList.remove('hidden');
        loadKeys();
      } catch (cause) { error.textContent = cause.message; error.classList.remove('hidden'); }
    });
    loadKeys();
  </script>
</body>
</html>
