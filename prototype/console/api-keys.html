<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Keys — homelab</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  body { font-family: 'Inter', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

<div class="max-w-3xl mx-auto px-6 py-12">
  <div class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center flex-shrink-0">
        <span class="text-white font-bold text-sm">H</span>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tight">API Keys</h1>
        <p class="text-sm text-gray-500">Manage additional keys for other operators</p>
      </div>
    </div>
    <a href="/console/" class="text-sm text-gray-500 hover:text-indigo-600 transition-colors">← Console</a>
  </div>

  <!-- Create form -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-6">
    <h2 class="text-sm font-semibold mb-4">Create new key</h2>
    <form onsubmit="createKey(event)" class="flex gap-3">
      <input type="text" id="key-label" placeholder="Label (e.g. laptop, phone)" required
        class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
        Create
      </button>
    </form>
    <p id="create-error" class="hidden mt-3 text-sm text-red-600"></p>
    <div id="new-key-box" class="hidden mt-4 bg-amber-50 border border-amber-200 rounded-xl p-4">
      <p class="text-xs font-semibold text-amber-800 mb-1">New key created — copy it now, it won't be shown again:</p>
      <p class="mono text-sm text-amber-900 break-all" id="new-key-value"></p>
    </div>
  </div>

  <!-- Keys list -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    <table class="w-full" id="keys-table">
      <thead>
        <tr class="border-b border-gray-100 text-left text-sm text-gray-500">
          <th class="px-5 py-3 font-medium">ID</th>
          <th class="px-5 py-3 font-medium">Label</th>
          <th class="px-5 py-3 font-medium">Created</th>
          <th class="px-5 py-3 font-medium w-20"></th>
        </tr>
      </thead>
      <tbody id="keys-body">
        <tr><td colspan="4" class="px-5 py-8 text-center text-sm text-gray-400">No API keys yet</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
function apiKey() { return sessionStorage.getItem('api_key') || ''; }
function authHeaders() { return { 'Authorization': 'Bearer ' + apiKey(), 'Content-Type': 'application/json' }; }

async function loadKeys() {
  try {
    const res = await fetch('/api-keys', { headers: authHeaders() });
    if (!res.ok) return;
    const keys = await res.json();
    const tbody = document.getElementById('keys-body');
    if (keys.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="px-5 py-8 text-center text-sm text-gray-400">No API keys yet</td></tr>';
      return;
    }
    tbody.innerHTML = keys.map(k => `
      <tr class="border-b border-gray-50">
        <td class="px-5 py-3 mono text-sm">${esc(k.id)}</td>
        <td class="px-5 py-3 text-sm">${esc(k.label)}</td>
        <td class="px-5 py-3 text-sm text-gray-500">${esc(k.created_at)}</td>
        <td class="px-5 py-3">
          <button onclick="revokeKey('${esc(k.id)}')" class="text-xs text-red-500 hover:text-red-700 transition-colors">Revoke</button>
        </td>
      </tr>
    `).join('');
  } catch {}
}

async function createKey(e) {
  e.preventDefault();
  const label = document.getElementById('key-label').value.trim();
  const err = document.getElementById('create-error');
  err.classList.add('hidden');
  document.getElementById('new-key-box').classList.add('hidden');

  try {
    const res = await fetch('/api-keys', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ label }),
    });
    if (!res.ok) { err.textContent = 'Failed to create key'; err.classList.remove('hidden'); return; }
    const data = await res.json();
    document.getElementById('key-label').value = '';
    document.getElementById('new-key-value').textContent = data.key;
    document.getElementById('new-key-box').classList.remove('hidden');
    loadKeys();
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
  }
}

async function revokeKey(id) {
  if (!confirm('Revoke key ' + id + '?')) return;
  try {
    await fetch('/api-keys/' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: authHeaders(),
    });
    loadKeys();
  } catch {}
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

loadKeys();
</script>

</body>
</html>
