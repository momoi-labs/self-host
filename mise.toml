[tools]
rust = "1.97"
# The console is a React app built with Vite (ADR-0016).
node = "24"

[tasks.setup-local]
description = "Prepare this machine to run the Platform from the checkout"
run = "bash scripts/setup-local.sh"

# The console is a built artifact the binary reads from console/dist, so the
# bundle goes first. A serve already holding :53, :443 and :80 has to go
# before the new one can bind them. What follows the task name goes to serve:
# `mise run serve --no-dns`.
[tasks.serve]
description = "Build the console, replace a running serve, and start the daemon"
run = [
  "cd console && npm run build",
  # The brackets keep pkill from matching this very command line.
  "pkill -f '[s]elf-host serve' || true",
  "cargo run -- serve",
]
