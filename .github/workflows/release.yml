name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to retry, or snapshot
        default: snapshot
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    # Native Apple builds and Zig cross-compilation for Linux share one run.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION == 'snapshot' && github.sha || env.VERSION }}
          fetch-depth: 0

      - name: Check release credentials
        if: env.VERSION != 'snapshot' && !contains(env.VERSION, '-')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$HOMEBREW_TAP_TOKEN" || { echo "Missing HOMEBREW_TAP_TOKEN"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Check version and prepare release notes
        if: env.VERSION != 'snapshot'
        run: |
          node scripts/release-version.mjs check "${VERSION#v}"
          node scripts/release-version.mjs notes > release-notes.md

      - run: npm ci && npm run build
        working-directory: console

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - run: cargo install --locked cargo-zigbuild

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --clean ${{ env.VERSION == 'snapshot' && '--snapshot' || '--release-notes=release-notes.md' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Replace the moving snapshot
        if: env.VERSION == 'snapshot'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view snapshot > /dev/null 2>&1; then
            gh release delete snapshot --cleanup-tag --yes
          fi

      - uses: softprops/action-gh-release@v2
        if: env.VERSION == 'snapshot'
        with:
          tag_name: snapshot
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            dist/*.tar.gz
            dist/*.pkg.tar.zst
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
